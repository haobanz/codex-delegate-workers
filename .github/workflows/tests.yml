name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - if: runner.os != 'Windows'
        run: bash -n install.sh
      - if: runner.os == 'Windows'
        name: Windows PowerShell 5.1 bootstrap
        shell: powershell
        run: .\tests\windows_bootstrap.ps1
      - if: runner.os == 'Windows'
        name: PowerShell 7 bootstrap
        shell: pwsh
        run: .\tests\windows_bootstrap.ps1
